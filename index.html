<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sail with Purpose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: premium corporate event; optimistic, calm, clear enough for six people around one screen
   IDEA: the bridge console of a ship on a night voyage under the aurora
   PICTURE: a sea chart with four destinations and a ship that gains sails and lights as missions activate
   COLOUR and TYPE: deep navy night with aurora cyan, green, violet, magenta; Sora display + Inter text
   LAYOUT: one action per screen, slim status bar, landscape first, stacks cleanly on phones */
:root{--disp:Sora,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark;--bg:#050f24;--bg2:#081a3a;--panel:#0c1f45;--panel2:#11295a;--line:#22407a;--ink:#f3f7ff;--soft:#b3c2e0;--muted:#7083ab;--cyan:#33e6f2;--blue:#4a8dff;--green:#41f2a5;--violet:#9479ff;--magenta:#ff52b9;--amber:#ffbf47;--red:#ff7484;--r:18px}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(55% 38% at 12% -4%,rgba(65,242,165,.16),transparent 70%),radial-gradient(48% 40% at 88% 0%,rgba(148,121,255,.22),transparent 70%),radial-gradient(70% 45% at 50% 112%,rgba(51,230,242,.13),transparent 70%),linear-gradient(#061433,#050f24 55%,#040d22)}
h1,h2,h3{font-family:var(--disp);line-height:1.08;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(30px,4vw,48px)}h2{font-size:clamp(24px,2.6vw,34px)}h3{font-size:19px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:17px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--cyan)}.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(95deg,var(--cyan),var(--green));color:#03122b;border:0;box-shadow:0 8px 30px -10px rgba(51,230,242,.7)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:0 16px;font-size:15px}
.btn.warn{border-color:#6b2b46;color:#ffd0dc}.btn.warn:hover{border-color:var(--red)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;color:var(--cyan);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--soft)}.tiny{font-size:13px;color:var(--soft)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.tag.ph{border-color:#7a5a12;color:#ffd98a;background:rgba(255,191,71,.08)}
.card{background:linear-gradient(180deg,rgba(17,41,90,.85),rgba(12,31,69,.85));border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 60px -30px rgba(0,0,0,.8)}
/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px max(3vw,14px);background:rgba(5,15,36,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(34,64,122,.6);min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:16px;white-space:nowrap}
.brand .ic{color:var(--cyan)}
.bar .grow{flex:1}
.who{display:flex;flex-direction:column;line-height:1.2}.who b{font-size:15px}.who span{font-size:12px;color:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--soft);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.dot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber)}.dot.off{background:var(--muted);box-shadow:none}.dot.busy{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);white-space:nowrap}
.meter i{display:block;width:90px;height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i b{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:9px;transition:width .6s}
/* screens */
.screen{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:clamp(16px,3vw,40px) max(3vw,14px)}
.wrap{width:100%;max-width:1180px}
.narrow{max-width:760px}
.stack>*+*{margin-top:18px}
.lead{font-size:19px;color:var(--soft);max-width:60ch}
/* welcome */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,56px);align-items:center}
.hero h1{font-size:clamp(38px,5.6vw,72px);letter-spacing:-.01em;line-height:1}
.hero h1 span{display:block;background:linear-gradient(90deg,var(--cyan),var(--green),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.motto{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--soft)}
.scene{border-radius:24px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:#03102a}
.scene svg{display:block;width:100%;height:100%}
/* forms */
.field{display:grid;gap:6px}.field label{font-weight:600;font-size:15px}
.input{width:100%;min-height:52px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:#071735;font-size:17px}
.input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(51,230,242,.25)}
textarea.input{min-height:90px;resize:vertical;line-height:1.45}
.err{color:#ffc2cc;font-size:14px;display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.avatars{display:flex;gap:10px;flex-wrap:wrap}
.av{width:56px;height:56px;border-radius:16px;border:2px solid var(--line);background:#071735;display:grid;place-items:center;cursor:pointer}
.av[aria-checked=true]{border-color:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 0 18px -4px currentColor}
.gid{font-family:var(--disp);font-size:30px;letter-spacing:.12em;color:var(--cyan)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.step{padding:20px;display:grid;gap:10px;align-content:start}
.step .ic{color:var(--cyan)}
.step b{font-family:var(--disp);font-size:17px}
/* map */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"e ship p" "i ship c";gap:18px;padding:22px;border-radius:26px;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,rgba(51,230,242,.08),transparent 60%),repeating-linear-gradient(0deg,rgba(51,230,242,.05) 0 1px,transparent 1px 64px),repeating-linear-gradient(90deg,rgba(51,230,242,.05) 0 1px,transparent 1px 64px),#06163a}
.map>svg.routes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dest{position:relative;text-align:left;display:grid;gap:8px;padding:20px;border-radius:20px;border:1.5px solid var(--line);background:rgba(8,26,58,.9);cursor:pointer;min-height:170px;align-content:start;transition:transform .2s,border-color .2s,box-shadow .2s}
.dest:hover{transform:translateY(-2px)}
.dest .code{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:24px;color:#03122b}
.dest h3{font-size:18px}
.dest .st{display:flex;gap:7px;align-items:center;font-size:14px;font-weight:600}
.dest.locked{opacity:.62;border-style:dashed;background:rgba(8,20,45,.85)}
.dest.locked .code{background:#2a3a5e!important;color:#9fb0d0}
.dest.current{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(51,230,242,.18),0 0 40px -10px var(--cyan)}
.dest.done{border-color:var(--green)}
.shipbox{grid-area:ship;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:10px}
.shipbox svg{width:100%;max-width:330px;height:auto}
.big{font-family:var(--disp);font-weight:700;font-size:clamp(26px,3vw,38px)}
/* category + missions */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mcard{display:grid;gap:10px;align-content:start;padding:22px;text-align:left;border-radius:20px;border:1.5px solid var(--line);background:rgba(8,26,58,.92);cursor:pointer;min-height:200px;transition:transform .2s,border-color .2s}
.mcard:hover{transform:translateY(-2px);border-color:var(--cyan)}
.mcard .mi{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.mcard.done{border-color:var(--green);background:linear-gradient(180deg,rgba(65,242,165,.10),rgba(8,26,58,.92))}
.pdots{display:flex;gap:6px}.pdots i{width:22px;height:6px;border-radius:9px;background:rgba(255,255,255,.14)}.pdots i.on{background:var(--green)}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--soft);font-size:14px}
/* brief */
.brief{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.brief .card{padding:clamp(20px,2.4vw,30px)}
.purpose{font-family:var(--disp);font-size:clamp(20px,2vw,26px);font-weight:600;line-height:1.25}
.blist{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.blist li{display:flex;gap:10px;align-items:flex-start}.blist li .ic{color:var(--green);margin-top:3px}
.kicker{font-size:14px;font-weight:700;color:var(--cyan)}
/* question */
.qwrap{display:grid;gap:20px}
.qhead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.qtext{font-family:var(--disp);font-weight:600;font-size:clamp(22px,2.4vw,32px);line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{display:flex;gap:16px;align-items:center;text-align:left;min-height:84px;padding:16px 20px;border-radius:18px;border:2px solid var(--line);background:rgba(8,26,58,.95);cursor:pointer;font-size:18px;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover{border-color:#3d64ad}
.opt .k{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;background:rgba(255,255,255,.07)}
.opt[aria-checked=true]{border-color:var(--cyan);background:rgba(51,230,242,.10)}
.opt[aria-checked=true] .k{background:var(--cyan);color:#03122b}
.fb{display:grid;gap:14px;padding:24px;border-radius:20px}
.fb.right{background:linear-gradient(120deg,rgba(65,242,165,.16),rgba(51,230,242,.08));border:1.5px solid var(--green)}
.fb.wrong{background:rgba(255,191,71,.07);border:1.5px solid #8a6a2a}
.fb h3{display:flex;gap:10px;align-items:center;font-size:24px}
.hint{padding:12px 16px;border-radius:14px;background:rgba(148,121,255,.12);border:1px solid #4b3d93}
/* celebration */
.celebrate{text-align:center;display:grid;gap:16px;justify-items:center}
.burst{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(65,242,165,.35),transparent 70%);animation:pop .8s ease-out both}
.burst .ic{color:var(--green)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.sailbadge{animation:pop .9s .1s ease-out both}
/* overlays */
.veil{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,10,26,.82);backdrop-filter:blur(6px);padding:20px}
.veil .card{padding:30px;max-width:520px;text-align:center;display:grid;gap:12px;justify-items:center}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(3,10,26,.78);padding:16px}
.modal[hidden]{display:none}
.mbox{width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:26px;display:grid;gap:16px}
.mact{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;z-index:70;background:#10285a;border:1px solid var(--line);padding:12px 18px;border-radius:14px;transition:.3s;max-width:min(92vw,560px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* console pages (facilitator / developer / dashboard) */
.console{padding:22px max(3vw,14px) 60px;display:grid;gap:18px;max-width:1500px;margin:0 auto}
.panel{padding:20px}
.panel h2{font-size:22px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv div{padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.kv b{display:block;font-family:var(--disp);font-size:26px}
.kv span{font-size:13px;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid rgba(34,64,122,.6);vertical-align:middle}
th{font-size:13px;color:var(--soft);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--soft)}
.tabs button[aria-selected=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--cyan)}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.sw input{width:22px;height:22px;accent-color:var(--cyan)}
details.sec{border:1px solid var(--line);border-radius:16px;background:rgba(12,31,69,.7)}
details.sec>summary{cursor:pointer;padding:16px 20px;font-family:var(--disp);font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
details.sec .in{padding:18px 20px;display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fgrid .input{min-height:46px;font-size:16px;padding:9px 12px}
.qed{padding:14px;border:1px solid var(--line);border-radius:14px;display:grid;gap:10px;background:rgba(5,15,36,.5)}
.oprow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.savebar{position:sticky;bottom:12px;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-radius:16px;background:rgba(8,26,58,.97);border:1px solid var(--line);box-shadow:0 12px 40px -12px #000;font-weight:600;color:var(--soft)}.savebar.dirty{border-color:var(--amber);color:#ffd98a}
.adminnav{display:flex;gap:6px;flex-wrap:wrap}
.adminnav a{color:var(--soft);text-decoration:none;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.adminnav a[aria-current=page]{color:var(--ink);background:var(--panel2)}
/* dashboard */
.dash{min-height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:14px;padding:16px max(2vw,14px)}
.dhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dhead h1{font-size:clamp(22px,2.2vw,32px)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);line-height:1.2}
.stat b{font-family:var(--disp);font-size:22px;display:block}.stat span{font-size:12px;color:var(--soft)}
.dbody{position:relative;min-height:420px;border-radius:22px;border:1px solid var(--line);background:rgba(6,22,58,.6);overflow:hidden}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;padding:14px;align-content:start;max-height:100%;overflow:auto}
.gt{padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(8,26,58,.9);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center}
.gt .mk{grid-row:span 2;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid;color:#03122b}
.gt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt .sub{font-size:12px;color:var(--soft);white-space:nowrap}
.gt .pips{grid-column:1/-1;display:flex;gap:4px;margin-top:4px}
.gt .pips i{flex:1;height:18px;border-radius:6px;font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.gt.s-registered .mk{background:#3a4866;border-color:#5b6b8c;color:#dbe3f5}
.gt.s-in_progress .mk{background:var(--blue);border-color:#9cc0ff;color:#fff}
.gt.s-completed{border-color:var(--green)}
.gt.s-completed .mk{background:var(--green);border-color:#fff;animation:glow 2.4s ease-in-out infinite}
.gt.idle .mk{box-shadow:0 0 0 3px var(--amber)}
@keyframes glow{0%,100%{box-shadow:0 0 6px 1px rgba(65,242,165,.6)}50%{box-shadow:0 0 22px 6px rgba(65,242,165,.75)}}
.mcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:16px;height:100%;align-content:start}
.mcol h3{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:17px}
.mcol h3 .code{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#03122b;font-weight:800}
.mt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(8,26,58,.9);margin-bottom:10px}
.mt.full{border-color:var(--c);box-shadow:0 0 30px -8px var(--c)}
.mt b{font-size:14px;line-height:1.25}
.mt .sub{font-size:12px;color:var(--soft)}
.ring{width:66px;height:66px}
.net{position:absolute;inset:0;width:100%;height:100%}
.net .edge{fill:none;stroke-width:1.1;opacity:.22}
.net .edge.new{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s ease-out forwards;opacity:.7}
.net.revealed .edge{opacity:.55;stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-32}}
.net text{font-family:Inter,system-ui,sans-serif;fill:var(--soft);font-size:12px}
.net .lbl{fill:var(--ink);font-weight:700}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft);background:rgba(5,15,36,.7);padding:8px 12px;border-radius:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.ready{padding:12px 18px;border-radius:14px;border:1.5px solid var(--green);background:rgba(65,242,165,.1);display:flex;gap:10px;align-items:center;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--soft);display:grid;gap:10px;justify-items:center}
/* final animation */
.final{position:fixed;inset:0;z-index:90;background:#020817;overflow:hidden}
.final[hidden]{display:none}
.final svg.fs{position:absolute;inset:0;width:100%;height:100%}
.fin-t{position:absolute;left:0;right:0;top:12%;text-align:center;opacity:0;transform:translateY(16px);transition:opacity 1.6s,transform 1.6s;padding:0 16px}
.fin-t h1{font-size:clamp(34px,6vw,92px);letter-spacing:.04em;color:#fff;text-shadow:0 0 30px rgba(159,246,255,.8),0 0 70px rgba(65,242,165,.5)}

function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function seeded(seed){let h=(parseInt(cyrb53(seed).slice(0,7),36)|0)||7;return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuffle(arr,seed){const a=arr.slice(),r=seeded(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

,copy:'M9 9h11v11H9zM5 15H4V4h11v1',users:'M8 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2 21c0-3.9 2.7-7 6-7s6 3.1 6 7M16 4.3a3.5 3.5 0 010 6.4M18 14.5c2.4.8 4 3.4 4 6.5',sparkle:'M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M6 18l3-3M15 9l3-3',home:'M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5',logout:'M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10',menu:'M4 7h16M4 12h16M4 17h16'};

function modal({title,body='',actions=[{label:'Close'}],dismiss=true}){

/* ================= data store: shared live database, or rehearsal mode on this device ================= */
const PFX='smg2027:';const lsubs=new Set();
const lread=p=>LS.get(PFX+p);
function lcoll(c){const out=[];try{const pre=PFX+c+'/';for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre)&&!k.slice(pre.length).includes('/')){const d=LS.get(k);if(d)out.push({...d,_id:k.slice(pre.length)})}}}catch(e){}return out.sort((a,b)=>a._id<b._id?-1:1)}
function lfire(path){for(const s of lsubs){const hit=s.doc?s.path===path:(path.startsWith(s.path+'/')&&!path.slice(s.path.length+1).includes('/'));if(hit)s.run()}}
addEventListener('storage',e=>{if(e.key&&e.key.startsWith(PFX))lfire(e.key.slice(PFX.length))});
const Store={db:null,
  async get(p){if(this.db){const s=await this.db.doc(p).get();return s.exists?s.data():null}return lread(p)},
  async list(c){if(this.db){const q=await this.db.collection(c).get();return q.docs.map(d=>({...d.data(),_id:d.id}))}return lcoll(c)},
  async set(p,d){if(this.db)return retry(()=>this.db.doc(p).set(d));LS.set(PFX+p,d);lfire(p)},
  async update(p,d){if(this.db)return retry(()=>this.db.doc(p).update(d));const o=lread(p);if(!o)throw{code:'invalid_argument'};LS.set(PFX+p,{...o,...d});lfire(p)},
  async del(p){if(this.db)return retry(()=>this.db.doc(p).delete());LS.del(PFX+p);lfire(p)},
  watch(p,cb,err){if(this.db)return this.db.doc(p).onSnapshot(s=>cb(s.exists?s.data():null,s.metadata),e=>{console.warn(p,e);err&&err(e)});const s={doc:true,path:p,run:()=>cb(lread(p),{fromCache:false})};lsubs.add(s);setTimeout(s.run,0);return()=>lsubs.delete(s)},
  watchAll(c,cb,err){if(this.db)return this.db.collection(c).onSnapshot(q=>cb(q.docs.map(d=>({...d.data(),_id:d.id})),q.metadata),e=>{console.warn(c,e);err&&err(e)});const s={doc:false,path:c,run:()=>cb(lcoll(c),{fromCache:false})};lsubs.add(s);setTimeout(s.run,0);return()=>lsubs.delete(s)},
  async claim(p,data){
    if(this.db){const ref=this.db.doc(p);if(ref.claim)return ref.claim(data);let r={acquired:true};try{r=await ref.acquire({holder:data.groupId,ttlMs:5000})}catch(e){}
      if(!r.acquired)return false;const s=await ref.get();if(s.exists&&s.data()?.groupId)return false;await ref.set(data);return true}
    if(lread(p))return false;LS.set(PFX+p,data);lfire(p);return true}
};
async function retry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await sleep(400+Math.random()*800);return fn()}throw e}}

/* ================= Firebase backend (self-hosting on Vercel or any static host) =================
   Used when firebase-config.js provides a config. Same API shape as the claude.ai database, so the
   rest of the app does not change. Real security is in firestore.rules. */
const FB_VER='10.12.2';
const FB={F:null,U:null,fs:null,auth:null,user:null};
function fbErr(e){const c=(e&&e.code)||'',m=String((e&&e.message)||c);let code=c;
  if(c==='permission-denied'||c==='unauthenticated')code='invalid_argument';
  else if(c==='resource-exhausted'||(c==='invalid-argument'&&/size|too large|exceeds/i.test(m)))code='quota_exceeded';
  else if(c==='invalid-argument')code='bad_data';
  const err=new Error(m);err.code=code;err.fbCode=c;return err}
const fbSnap=s=>({exists:s.exists(),id:s.id,data:()=>s.data(),metadata:s.metadata});
function fbDb(){const F=FB.F,fs=FB.fs;const w=pr=>pr.catch(e=>{throw fbErr(e)});
  return{
    doc(p){const r=F.doc(fs,p);return{
      get:()=>w(F.getDoc(r)).then(fbSnap),
      set:d=>w(F.setDoc(r,d)),
      update:d=>w(F.updateDoc(r,d)),
      delete:()=>w(F.deleteDoc(r)),
      onSnapshot:(cb,err)=>F.onSnapshot(r,s=>cb(fbSnap(s)),e=>err&&err(fbErr(e))),
      claim:d=>w(F.runTransaction(fs,async t=>{const s=await t.get(r);if(s.exists()&&s.data()?.groupId)return false;t.set(r,d);return true}))}},
    collection(c){const q=F.collection(fs,c);return{
      get:()=>w(F.getDocs(q)).then(s=>({docs:s.docs.map(fbSnap)})),
      onSnapshot:(cb,err)=>F.onSnapshot(q,s=>cb({docs:s.docs.map(fbSnap),metadata:s.metadata}),e=>err&&err(fbErr(e)))}}
  }}
async function fbConnect(cfg){
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  const[A,F,U]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
  const app=A.initializeApp(cfg);let fs;
  try{fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
  catch(e){fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true})}
  const auth=U.getAuth(app);Object.assign(FB,{F,U,fs,auth});
  await new Promise(r=>{let done=false;const fin=()=>{if(!done){done=true;r()}};U.onAuthStateChanged(auth,u=>{FB.user=u;fin()});setTimeout(fin,5000)});
  return fbDb()}
/* admin = a signed-in account that firestore.rules allows to read cfg/keys */
async function fbIsAdmin(){if(!FB.user)return false;
  try{await Promise.race([FB.F.getDocFromServer(FB.F.doc(FB.fs,'cfg/keys')),sleep(8000).then(()=>{throw new Error('timeout')})]);return true}catch(e){return false}}
async function fbLogin(email,pw){
  if(!email||!pw)return'bad';
  try{await FB.U.signInWithEmailAndPassword(FB.auth,email,pw);FB.user=FB.auth.currentUser}
  catch(e){const c=(e&&e.code)||'';return/too-many/.test(c)?'wait':/network/.test(c)?'offline':'bad'}
  if(await fbIsAdmin()){S.admin=true;return'ok'}
  try{await FB.U.signOut(FB.auth)}catch(e){}FB.user=null;return'notadmin'}

/* ================= global state ================= */
const S={mode:'connecting',backend:'none',admin:false,canWrite:null,event:null,live:null,content:null,keys:null,eventOk:false,contentOk:false,liveOk:false,online:navigator.onLine,lastUpdate:0,groupsRaw:[],ctrl:{},groupsOk:false,slow:false};
const DEF_EVENT={eventName:'Sail with Purpose · Site Mission 2027',eventId:'SM2027',startTime:'',endTime:'',maxGroups:80,finalAnimationEnabled:true,
  logic:{questionsPerMission:3,maxAttempts:0,hintThreshold:2,categoryLocking:true,shuffleAnswers:true,shuffleOnRetry:true,timeoutMin:5,timerVisible:true,durationMin:60,exceptionsCount:true},
  dashboard:{view:'groups',refreshSec:5,intensity:'normal',labelMode:'name',showPercent:true,rotateSec:0}};
const DEF_LIVE={status:'live',registrationOpen:true,denominatorLocked:false,finalTrigger:0,finalAt:0,startedAt:0};
const ev=()=>{const e=S.event||{};return{...DEF_EVENT,...e,logic:{...DEF_EVENT.logic,...(e.logic||{})},dashboard:{...DEF_EVENT.dashboard,...(e.dashboard||{})}}};
const lv=()=>({...DEF_LIVE,...(S.live||{})});

const CT={
  cats(){return(S.content?.categories||[]).slice().sort(byOrder).slice(0,4)},
  cat(id){return(S.content?.categories||[]).find(c=>c.id===id)},
  missions(cid){return(S.content?.missions||[]).filter(m=>m.categoryId===cid&&m.active!==false).sort(byOrder)},
  all(){return CT.cats().flatMap(c=>CT.missions(c.id))},
  mission(id){return(S.content?.missions||[]).find(m=>m.id===id)},
  qs(mid){const n=+ev().logic.questionsPerMission||0;const a=(S.content?.questions||[]).filter(q=>q.missionId===mid&&q.active!==false).sort(byOrder);return n>0?a.slice(0,n):a},
  ok(q,opt){return !!(S.content&&q&&opt)&&cyrb53(S.content.salt+'|'+q.id+'|'+opt)===q.check}
};
function evalGroup(g){
  const ms=CT.all(),solved=g.solved||{};
  const done=ms.filter(m=>{const qs=CT.qs(m.id);return qs.length>0&&qs.every(q=>CT.ok(q,solved[q.id]))}).map(m=>m.id);
  const catsDone=CT.cats().filter(c=>{const mm=CT.missions(c.id);return mm.length>0&&mm.every(m=>done.includes(m.id))}).map(c=>c.id);
  const total=ms.length||12,exc=!!g.exception;
  const complete=(exc&&ev().logic.exceptionsCount)||(ms.length>0&&done.length===ms.length);
  const started=Object.keys(solved).length>0||!!g.currentCategory||Object.keys(g.attempts||{}).length>0;
  const status=complete?'completed':started?'in_progress':'registered';
  const idle=status==='in_progress'&&now()-(g.lastActivity||0)>(+ev().logic.timeoutMin||5)*60000;
  return{done,catsDone,total,complete,exc,status,idle,pct:complete?100:Math.round(done.length/total*100)};
}
/* merge each group record with facilitator-owned control fields */
function groups(){
  return S.groupsRaw.map(d=>{const c=S.ctrl[d._id]||{};let g={...d,groupId:d.groupId||d._id,name:c.name||d.groupName||'Group',include:c.include??d.include??true,exception:c.exception||null,removed:!!c.removed};
    if((c.resetEpoch||0)>(d.resetEpoch||0))g={...g,solved:{},attempts:{},currentCategory:null,currentMission:null};
    g.ev=evalGroup(g);return g}).filter(g=>!g.removed).sort((a,b)=>(a.registeredAt||0)-(b.registeredAt||0));
}
function aggregate(){
  const gs=groups(),inc=gs.filter(g=>g.include!==false),N=inc.length,ms=CT.all();
  const mstat=ms.map(m=>{const n=inc.filter(g=>g.ev.done.includes(m.id)||(g.ev.exc&&g.ev.complete)).length;return{m,n,N,pct:N?Math.round(n/N*100):0,full:N>0&&n===N}});
  const completed=inc.filter(g=>g.ev.complete).length;
  const ready=N>0&&completed===N&&mstat.length>0&&mstat.every(x=>x.full);
  return{gs,inc,N,mstat,completed,inProg:inc.filter(g=>g.ev.status==='in_progress').length,ready,fullCount:mstat.filter(x=>x.full).length,
    overall:N&&ms.length?Math.round(inc.reduce((s,g)=>s+(g.ev.complete?ms.length:g.ev.done.length),0)/(N*ms.length)*100):0};
}

/* ================= admin login =================
   Only a PBKDF2 hash of the password is in this page. The database rules are the real lock:
   saving config, content and facilitator changes also requires Editor access to the page. */
const AUTH={salt:'swp-adm-7f3k2q',hash:'28612b3079cc372ceef9f78c68b929981944f5caf23b1ab7fdec719fa6927f38',mem:false,fails:0,until:0,
  ok(){if(S.backend==='firebase')return !!S.admin;if(this.mem)return true;try{const a=JSON.parse(sessionStorage.getItem('smg:admin')||'null');return !!a&&a.h===this.hash.slice(0,16)&&a.exp>now()}catch(e){return false}}};
async function pbkdf(pw){const enc=new TextEncoder();const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(AUTH.salt),iterations:150000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryLogin(pw){
  if(now()<AUTH.until)return'wait';let h;try{h=await pbkdf(pw)}catch(e){return'unsupported'}
  if(h===AUTH.hash){AUTH.fails=0;AUTH.mem=true;try{sessionStorage.setItem('smg:admin',JSON.stringify({h:AUTH.hash.slice(0,16),exp:now()+12*3600e3}))}catch(e){}return'ok'}
  if(++AUTH.fails>=5){AUTH.fails=0;AUTH.until=now()+30000}return'bad'}
function logout(){if(S.backend==='firebase'){S.admin=false;FB.U&&FB.U.signOut(FB.auth).catch(()=>{});FB.user=null}AUTH.mem=false;try{sessionStorage.removeItem('smg:admin')}catch(e){}closeModal();toast('Logged out of admin.');goHome()}

  ${S.backend==='firebase'?`<div class="field"><label for="em">Admin email</label><input class="input" id="em" type="email" autocomplete="username" inputmode="email"></div>`:''}

const DEVICE='smg:device';
const P={g:null,ctrl:null,screen:'welcome',ui:{},unsubG:null,unsubC:null,saving:false,dirty:false,failing:false,denied:false,lastSaved:0,form:{name:'',num:'',table:'',avatar:0},err:'',lastScreen:''};
const AVATARS=['#33e6f2','#41f2a5','#9479ff','#ff52b9','#4a8dff','#ffbf47'];
const gname=()=>(P.ctrl&&P.ctrl.name)||P.g?.groupName||'';
function backup(){if(P.g)LS.set('smg:backup:'+P.g.groupId,P.g)}

function attachGroup(g,pushLocal){
  P.g=g;LS.set(DEVICE,{groupId:g.groupId});backup();
  P.unsubG?.();P.unsubC?.();
  P.unsubG=Store.watch('groups/'+g.groupId,(d,meta)=>{
    S.lastUpdate=now();
    if(!P.g)return;
    if(!d){if(meta&&meta.fromCache===false&&!P.saving&&!P.dirty&&S.mode==='live')markRemoved();return}
    const L=P.g,re=(d.resetEpoch||0),le=(L.resetEpoch||0);
    if(re>le||(re===le&&(d.rev||0)>(L.rev||0))){P.g=d;backup();if(re>le){P.screen='map';P.ui={};toast('A facilitator reset your progress. Start again from the map.')}rerender()}else chrome();
  },()=>{P.failing=true;chrome()});
  P.unsubC=Store.watch('ctrl/'+g.groupId,c=>{
    P.ctrl=c||null;if(!P.g)return;
    if(c&&c.removed){markRemoved();return}
    if(c&&(c.resetEpoch||0)>(P.g.resetEpoch||0))applyReset(c.resetEpoch);
    rerender();
  });
  if(pushLocal)queueSave();
}
function applyReset(ep){const g=P.g;P.g={...g,currentCategory:null,currentMission:null,completedCategories:[],completedMissions:[],overallProgress:0,solved:{},attempts:{},briefOpened:{},log:[],status:'registered',completedAt:null,resetEpoch:ep,rev:(g.rev||0)+1};P.screen='map';P.ui={};backup();queueSave();toast('A facilitator reset your progress. Start again from the map.')}
function markRemoved(){P.unsubG?.();P.unsubC?.();P.g=null;P.ctrl=null;LS.del(DEVICE);P.screen='removed';rerender(true)}
function commit(mut){
  const g=clone(P.g);g.solved=g.solved||{};g.attempts=g.attempts||{};g.briefOpened=g.briefOpened||{};g.log=g.log||[];
  mut(g);const e=evalGroup(g);
  if(g.currentCategory&&e.catsDone.includes(g.currentCategory))g.currentCategory=null;
  g.completedMissions=e.done;g.completedCategories=e.catsDone;g.overallProgress=e.pct;g.status=e.status;g.lastActivity=now();g.rev=(g.rev||0)+1;
  if(e.complete&&!g.completedAt)g.completedAt=now();
  P.g=g;backup();queueSave();return e;
}
async function queueSave(){
  P.dirty=true;chrome();if(P.saving)return;P.saving=true;
  while(P.dirty&&P.g){
    P.dirty=false;const snap=P.g;
    try{await Store.set('groups/'+snap.groupId,snap);P.failing=false;P.lastSaved=now()}
    catch(e){P.dirty=true;P.failing=true;chrome();
      if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){P.denied=true;break}
      if(e&&e.code==='quota_exceeded'){toast('The event database is full. Please tell a facilitator.');break}
      await sleep(3000)}
  }
  P.saving=false;chrome();
}
addEventListener('online',()=>{S.online=true;if(P.g&&(P.dirty||P.failing))queueSave();chrome()});
addEventListener('offline',()=>{S.online=false;chrome()});

async function resumeDevice(){
  const d=LS.get(DEVICE);if(!d||!d.groupId)return false;
  let g=null;try{g=await Store.get('groups/'+d.groupId)}catch(e){}
  const b=LS.get('smg:backup:'+d.groupId);
  let c=null;try{c=await Store.get('ctrl/'+d.groupId)}catch(e){}
  if(c&&c.removed){LS.del(DEVICE);return false}
  let use=g,pushLocal=false;
  if(b&&(!g||((b.resetEpoch||0)>=(g.resetEpoch||0)&&(b.rev||0)>(g.rev||0)))){use=b;pushLocal=true}
  if(!use){LS.del(DEVICE);return false}
  P.ctrl=c;attachGroup(use,pushLocal);P.screen=resumeScreen();return true;
}
function resumeScreen(){
  const g=P.g;if(!g)return'welcome';const e=evalGroup(g);
  if(e.complete)return'allDone';
  if(g.currentMission&&!e.done.includes(g.currentMission)&&g.briefOpened?.[g.currentMission])return'question';
  if(g.currentCategory)return'category';
  return'map';
}

}

  const g=P.g,m=CT.mission(P.ui.mid||g.currentMission);if(!m){P.screen='category';return SC.category()}
  P.ui.mid=m.id;const qs=CT.qs(m.id),lg=ev().logic;
  const idx=qs.findIndex(q=>!CT.ok(q,g.solved?.[q.id]));

  const opts=doShuffle?shuffle(q.options||[],g.groupId+q.id+(lg.shuffleOnRetry?att:0)):(q.options||[]);

  else foot=`<div class="row"><button class="btn primary" data-act="submit" ${P.ui.sel?'':'disabled'}>Lock in our answer</button><button class="btn ghost" data-act="review">${icon('book',18)}Review Mission Brief</button></div>`;

/* ---- player actions ---- */
const ACT={
  go(a){if(a==='category'&&!P.g?.currentCategory&&!P.ui.viewCat)a='map';P.screen=a;P.err='';if(a!=='question')P.ui.fb=null;renderPlay()},
  async register(){
    const name=String(P.form.name||'').trim().replace(/\s+/g,' ');
    const setErr=m=>{P.err=m;const el=$('#nameerr');if(el)el.innerHTML=m?`<p class="err">${icon('alert',16)}${esc(m)}</p>`:'';$('#f-name')?.focus()};
    if(name.length<2)return setErr('Please enter a group name (at least 2 characters).');
    if(!lv().registrationOpen)return setErr('Registration is closed.');
    const key=nameKey(name);
    try{const taken=await Store.get('names/'+key);if(taken&&taken.groupId)return setErr(`"${name}" is already registered. Choose another name, or go back and use “Continue your journey” if this is your group.`)}catch(e){}
    try{const all=await Store.list('names');if(all.length>=(+ev().maxGroups||80))return setErr('The event has reached its maximum number of groups. Please speak to a facilitator.')}catch(e){}
    modal({title:'Confirm your group name',body:`<p>You are registering as</p><p class="big">${esc(name)}</p><p class="muted">Everyone at your table will play on this device under this name.</p>`,
      actions:[{label:'Change name',cls:'ghost'},{label:'Confirm and register',cls:'primary',fn:async()=>{
        const id=key;
        let ok=false;try{ok=await Store.claim('names/'+key,{groupId:id,name,at:now()})}catch(e){setErr(e&&e.code==='invalid_argument'?'This device does not have permission to join the event. Please ask a facilitator.':'Could not register right now. Please check the connection and try again.');return}
        if(!ok){setErr(`"${name}" was just registered by another group. Please choose another name.`);return}
        const g={groupId:id,groupName:name,registeredAt:now(),currentCategory:null,currentMission:null,completedCategories:[],completedMissions:[],overallProgress:0,solved:{},attempts:{},briefOpened:{},log:[],status:'registered',lastActivity:now(),include:!lv().denominatorLocked,lateRegistration:!!lv().denominatorLocked,resetEpoch:0,rev:1};
        try{await Store.set('groups/'+id,g)}catch(e){Store.del('names/'+key).catch(()=>{});setErr(e&&e.code==='invalid_argument'?'This device does not have permission to join the event. Please ask a facilitator.':'Could not register right now. Please try again.');return}
        P.ctrl=null;attachGroup(g);P.lastSaved=now();P.screen='aboard';renderPlay();
      }}]});
  },
  async doResume(){
    const nm=String($('#f-gid')?.value||'').trim().replace(/\s+/g,' ');const er=m=>{P.err=m;$('#giderr').innerHTML=`<p class="err">${icon('alert',16)}${esc(m)}</p>`};
    if(nm.length<2)return er('Enter the group name you registered with.');
    let g=null,c=null;try{const n=await Store.get('names/'+nameKey(nm));const id=(n&&n.groupId)||nameKey(nm);g=await Store.get('groups/'+id);c=await Store.get('ctrl/'+id)}catch(e){}
    if(!g||(c&&c.removed))return er(`No group named "${nm}" is registered. Check the spelling or ask a facilitator.`);
    P.ctrl=c;P.err='';attachGroup(g);P.screen=resumeScreen();toast(`Welcome back, ${gname()}.`);renderPlay();
  },
  cat(cid){
    const g=P.g,e=evalGroup(g),lg=ev().logic,c=CT.cat(cid);
    const cur=lg.categoryLocking&&g.currentCategory&&!e.catsDone.includes(g.currentCategory)?g.currentCategory:null;
    if(e.catsDone.includes(cid)){P.ui.viewCat=cid;P.screen='category';return renderPlay()}
    if(cur&&cur!==cid){const cc=CT.cat(cur);const m=`${c.code} is locked. Your group chose ${cc.code}, so complete all three of its Site Missions first. Then every remaining destination unlocks.`;const el=$('#lockmsg');if(el)el.textContent=m;toast(m);return}
    if(g.currentCategory===cid){P.ui.viewCat=null;P.screen='category';return renderPlay()}
    modal({title:`Set sail for ${c.code}?`,body:`<p class="big">${esc(c.name)}</p><p class="muted">${lg.categoryLocking?'Your group will complete all three Site Missions here before choosing another destination.':'You can switch destinations at any time.'}</p>`,
      actions:[{label:'Not yet',cls:'ghost'},{label:`Sail to ${c.code}`,cls:'primary',fn:()=>{commit(x=>{x.currentCategory=cid});P.ui.viewCat=null;P.screen='category';renderPlay()}}]});
  },
  mission(mid){P.ui={mid,viewCat:P.ui.viewCat};const g=P.g;if(!g.briefOpened?.[mid]||g.currentMission!==mid)commit(x=>{x.briefOpened[mid]=true;x.currentMission=mid});P.screen='brief';renderPlay()},
  startq(){P.ui.fromQ=false;P.screen='question';renderPlay()},
  review(){P.ui.fromQ=true;P.ui.fb=null;P.ui.sel=null;P.screen='brief';renderPlay()},
  sel(id){if(P.ui.fb)return;P.ui.sel=id;$$('.opt').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.arg===id)));const s=$('[data-act=submit]');if(s)s.disabled=false},
  submit(){
    const m=CT.mission(P.ui.mid),qs=CT.qs(m.id),q=qs.find(x=>!CT.ok(x,P.g.solved?.[x.id]));if(!q||!P.ui.sel)return;
    const opt=P.ui.sel,ok=CT.ok(q,opt);
    commit(g=>{const n=(g.attempts[q.id]||0)+1;g.attempts[q.id]=n;g.log.push({q:q.id,o:opt,c:ok,n,t:now()});if(g.log.length>240)g.log=g.log.slice(-240);if(ok)g.solved[q.id]=opt;g.currentMission=m.id});
    P.ui.fb=ok?'right':'wrong';P.ui.q=q.id;renderPlay();

function ring(p,col,full){const r=27,C=2*Math.PI*r;return`<svg class="ring" viewBox="0 0 66 66" aria-hidden="true"><circle cx="33" cy="33" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="7"/><circle cx="33" cy="33" r="${r}" fill="none" stroke="${p?col:'transparent'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 33 33)" ${full?`style="filter:drop-shadow(0 0 6px ${col})"`:''} opacity="${full?1:.75}"/><text x="33" y="38" text-anchor="middle" font-family="Sora, Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="${full?col:'#f3f7ff'}">${p}%</text></svg>`}

function drawNetwork(body,A){
  let svg=$('#netsvg',body);
  if(!svg){body.innerHTML=`<svg class="net" id="netsvg" role="img" aria-label="Network of groups, Site Missions, categories and the Site Mission 2027 destination"></svg><div class="legend" id="netleg"></div>`;svg=$('#netsvg',body)}
  const W=body.clientWidth||1000,H=body.clientHeight||600,cx=W/2,cy=H/2,mn=Math.min(W,H);
  const cats=CT.cats(),angs=[-135,-45,45,135].map(a=>a*Math.PI/180);
  const hubs={},mnodes={};let s='';
  const defs=`<defs><filter id="ng"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="ncore"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#bff8ff"/><stop offset="1" stop-color="#33e6f2" stop-opacity=".2"/></radialGradient></defs>`;
  cats.forEach((c,i)=>{const a=angs[i];hubs[c.id]={x:cx+Math.cos(a)*mn*.17,y:cy+Math.sin(a)*mn*.17,col:safeColor(c.color),c};

  const edges=new Set();let eg='';

    const ha=hubs[m.m.categoryId]?Math.atan2(hubs[m.m.categoryId].y-cy,hubs[m.m.categoryId].x-cx):m.a;const fx=cx+Math.cos(ha)*mn*.5,fy=cy+Math.sin(ha)*mn*.5;const c1x=p.x+(cx-p.x)*.3,c1y=p.y+(cy-p.y)*.3;

    CT.missions(c.id).forEach(m=>{const mn_=mnodes[m.id],x=A.mstat.find(s=>s.m.id===m.id);core+=`<line x1="${mn_.x}" y1="${mn_.y}" x2="${h.x}" y2="${h.y}" stroke="${h.col}" stroke-width="${x?.full?3:1.5}" opacity="${x?.full?.95:.25}" ${x?.full?'filter="url(#ng)"':'stroke-dasharray="4 6"'}/>`});

  let nodes='';
  Object.values(mnodes).forEach(m=>{const x=A.mstat.find(s=>s.m.id===m.m.id)||{pct:0,full:false};const r=Math.max(14,mn*.028);const out=m.a;const lx=m.x+Math.cos(out)*(r+10),ly=m.y+Math.sin(out)*(r+10);const anc=Math.cos(out)>.2?'start':Math.cos(out)<-.2?'end':'middle';

  cats.forEach(c=>{const h=hubs[c.id];nodes+=`<circle cx="${h.x}" cy="${h.y}" r="${Math.max(18,mn*.035)}" fill="${h.col}"/><text x="${h.x}" y="${h.y+6}" text-anchor="middle" class="lbl" style="fill:#03122b;font-family:var(--disp);font-size:17px">${esc(c.code)}</text>`});

  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.classList.toggle('revealed',A.ready);

  async dSaveSettings(){try{const s=DV.set;await Store.set('cfg/event',{...s.event,updatedAt:now()});await Store.set('cfg/live',{...lv(),status:s.live.status,registrationOpen:s.live.registrationOpen,updatedAt:now()});DV.setDirty=false;DV.lastSet=now();updBar();toast('Settings saved.')}catch(e){console.error(e);saveFailed('settings',e)}},
  async dSaveContent(){const d=clone(DV.draft);if(!S.keysOk&&S.mode==='live')return toast('Still loading the correct answers. Try again in a moment.');const iss=validateDraft(d);if(iss.length)return showIssues(iss);
    const salt='sm27-'+Math.random().toString(36).slice(2,10);const keys={};
    d.questions=d.questions.map(q=>{const options=(q.options||[]).filter(o=>String(o.text||'').trim()).map(o=>({id:o.id,text:String(o.text).trim()}));keys[q.id]=q.correctOptionId;const{correctOptionId,...rest}=q;return{...rest,options,check:cyrb53(salt+'|'+q.id+'|'+correctOptionId)}});
    ['categories','missions','questions'].forEach(k=>d[k].forEach(x=>{if('order'in x)x.order=+x.order||0}));

  dAddCat(){const d=DV.draft;d.categories=d.categories||[];d.missions=d.missions||[];d.questions=d.questions||[];if(d.categories.length>=4)return toast('The game has 4 categories.');
    const used=d.categories.map(c=>c.code);const code=['E','P','I','C'].find(x=>!used.includes(x))||String(d.categories.length+1);let id='cat-'+code.toLowerCase();while(d.categories.some(c=>c.id===id))id+='x';
    const cols={E:'#33e6f2',P:'#41f2a5',I:'#9479ff',C:'#ff52b9'};d.categories.push({id,code,name:'Category '+code,description:'',icon:'compass',color:cols[code]||'#33e6f2',order:Math.max(0,...d.categories.map(c=>+c.order||0))+1});

   <g><rect x="0" y="606" width="330" height="16" fill="#0a1d42"/>${[30,90,150,210,270].map(x=>`<rect x="${x}" y="622" width="8" height="40" fill="#081733"/>`).join('')}<path d="M70 606L80 470H104L114 606Z" fill="#0c2450" stroke="#33e6f2" stroke-width="1.5"/><rect x="78" y="452" width="28" height="20" fill="#fff3c4" class="nl"/><path class="beam" d="M106 462L420 420V505Z" fill="#fff3c4"/></g>
   <g class="fnet">${edges}${nodes}</g>

    <path d="M212 -24V-60H272L294 -24Z" fill="#11295a" stroke="#33e6f2" stroke-width="1.5"/>${[222,240,258].map(x=>`<rect class="win" x="${x}" y="-52" width="12" height="9" rx="2"/>`).join('')}

    <circle class="nl" cx="150" cy="-280" r="7" fill="#fff" filter="url(#fglow)"/><circle class="nl" cx="330" cy="-12" r="6" fill="#41f2a5" filter="url(#fglow)"/><circle class="nl" cx="6" cy="-12" r="6" fill="#ff5d6c" filter="url(#fglow)"/></g></g></svg>
  <div class="fin-t"><h1>SITE MISSION 2027 ACTIVATED</h1><p>Ready. Rise. Win.<br>We Sail with Purpose.</p></div>
  <p class="fin-cap" id="fcap" aria-live="polite"></p>
  <div class="fin-ctl"><button class="btn small" id="frep">${icon('refresh',18)}Replay</button><button class="btn small" id="ffs">${icon('expand',18)}Full screen</button><button class="btn small" id="fx">${icon('x',18)}Close</button></div>`;
}
function playFinal(){
  const el=$('#final');FIN.timers.forEach(clearTimeout);FIN.timers=[];
  el.className='final';el.innerHTML=finalMarkup();el.hidden=false;
  const steps=[[0,'The complete mission network lights up.'],[3200,'Aurora energy flows from every group to the twelve Site Missions.'],[7000,'E, P, I and C channel the energy toward the ship.'],[10500,'The ship\'s navigation lights turn on.'],[12500,'The sails unfurl.'],[15000,'The ship moves out of the harbor.'],[19000,'It begins sailing toward a bright horizon.'],[21000,'Aurora lights spread across the sky and water.'],[26000,'Site Mission 2027 activated. Ready. Rise. Win. We sail with purpose.']];
  const k=reduced?.45:1;
  steps.forEach(([t,cap],i)=>FIN.timers.push(setTimeout(()=>{el.classList.add('s'+(i+1));const c=$('#fcap');if(c)c.textContent=cap},t*k+60)));
  $('#frep').onclick=()=>playFinal();
  $('#ffs').onclick=()=>{(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.())?.catch?.(()=>toast('Full screen is not available here.'))};
  $('#fx').onclick=()=>{FIN.timers.forEach(clearTimeout);el.hidden=true;el.innerHTML='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})};
  setTimeout(()=>$('#fx')?.focus(),100);
}

/* ======================================================================
   BOOT
   ====================================================================== */
function onLive(d){
  const prev=S.live?.finalTrigger;S.live=d;S.liveOk=true;S.lastUpdate=now();
  const ft=d?.finalTrigger||0;
  if(D.finalSeen===null)D.finalSeen=ft;
  else if(ft>D.finalSeen){D.finalSeen=ft;const v=view();if(ev().finalAnimationEnabled&&(v==='dashboard'||(v==='play'&&P.g&&evalGroup(P.g).complete)))playFinal()}
  refreshView();
}
function refreshView(){const v=view();if(v==='play')rerender();else if(v==='dashboard')schedDash();else if(v==='facilitator')schedFac();else if(v==='developer'&&!DV.dirty&&!DV.setDirty&&!$('#dev:focus-within'))renderDev()}
async function boot(){
  const fcfg=window.FIREBASE_CONFIG;
  if(fcfg&&fcfg.apiKey&&fcfg.projectId){
    let fdb=null;try{fdb=await Promise.race([fbConnect(fcfg),sleep(20000).then(()=>null)])}catch(e){console.warn('Firebase',e)}
    if(!fdb){S.mode='error';render();return}
    Store.db=fdb;S.mode='live';S.backend='firebase';S.canWrite=true;S.admin=await fbIsAdmin();
    return bootData()}
  let c=window.claude;
  for(let i=0;i<6&&!(c&&c.use);i++){await sleep(200);c=window.claude}
  let db=null,user=null;
  if(c&&c.use){const to=new Promise(r=>setTimeout(()=>r(null),10000));try{[db,user]=await Promise.all([Promise.race([c.use('db'),to]),Promise.race([c.use('user'),to])])}catch(e){}}
  if(db){Store.db=db;S.mode='live';try{S.admin=!!(await user?.canEdit?.())}catch(e){S.admin=false}try{S.canWrite=await user?.can?.('data.write')}catch(e){}}
  else{S.mode='local';S.admin=true}
  S.backend=db?'claude':'local';
  return bootData()}
function bootData(){
  let first=0;const ready=()=>{if(++first===3){if(view()==='play'){resumeDevice().then(r=>{renderPlay()})}else render()}};
  Store.watch('cfg/event',d=>{S.event=d;S.eventOk=true;if(first<3)ready();else refreshView()});
  Store.watch('cfg/live',d=>{if(first<3){S.live=d;D.finalSeen=d?.finalTrigger||0;S.liveOk=true;ready()}else onLive(d)});
  Store.watch('cfg/content',d=>{S.content=d;S.contentOk=true;if(first<3)ready();else refreshView()});
  setTimeout(()=>{if(first<3){S.slow=true;first=2;ready()}},10000);
  setInterval(()=>{chrome()},1000);
  trapBack();
}
boot();
}
